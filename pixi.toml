[workspace]
name = "conda-forge-staging-recipes"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
rattler-build = ">=0.79,<1"
requests = ">=2.32,<3"
"ruamel.yaml" = ">=0.18,<0.19"
zstandard = ">=0.23,<1"
pytest = ">=8,<10"
jinja2 = ">=3,<4"
packaging = ">=24"

[tasks]
build = "python scripts/build.py"
pinning-render = "python -m staging.pinning render --config pinning.yaml"
pinning-update = "python scripts/update_pinning.py"
test = "pytest -q"
